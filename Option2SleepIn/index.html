<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waking up late!</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Heading and context -->
    <h1 class="header">You overslept!</h1>
    <h1 class="header">You must get ready quickly to catch the bus on time.</h2>

    <!-- Alarm image -->
    <section class="alarm parallax"></section>

    <!-- context - parallax effect -->
    <section class="content">
        <h2>Now that you are ready, let's walk to the bus stop.</h2>
    </section>

    <!-- Bus image -->
    <section class="bus parallax"></section>

    <!-- context - parallax effect -->
    <section class="content">
        <h2>Oh no! You missed the bus. You will have to wait for the next one now.</h2>
    </section>

    <!-- bus stop image -->
    <section class="busstop parallax"></section>

    <!-- context -->
    <h1 class="header">Finally! The bus is here!</h1>

    <!-- user clicks to get on -->
    <button id="btn1">Click to get on bus</button>

    <!-- connecting javascript -->
    <script src="js/script.js"></script>
</body>
</html>
