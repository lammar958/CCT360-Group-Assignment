<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productive Ending!</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1 class="header">You made it home!</h1>

    <section class="home parallax"></section>

    <section class="content">
        <h2>8:30 pm</h2>
        <h2>After studying at the library, you are almost done your assignment!</h2>
        <h2>Just a few things left before you can submit.</h2>
    </section>

    <h1 class="header">Finish Your Assignment!</h1>

    <section class="checklist">
        <h2>Assignment Checklist</h2>

        <label>
            <input type="checkbox" id="task1">
            Finish writing
        </label>

        <label>
            <input type="checkbox" id="task2">
            Check references
        </label>

        <label>
            <input type="checkbox" id="task3">
            Proofread assignment
        </label>

        <h2 id="progress">0 out of 3 tasks completed!</h2>

        <button id="submitbtn">Submit Assignment!</button>
    </section>

    <section class="content" id="ending">
        <h2 id="message">Complete your checklist to submit!</h2>
    </section>

    <div class="btnstyle">
        <button id="restartbtn">Start Again!</button>
    </div>

    <script src="js/script.js"></script>

</body>
</html>
