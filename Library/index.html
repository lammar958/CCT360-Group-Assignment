<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Study Session</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1 class="header">You decided to study!</h1>

    <section class="library parallax"></section>

    <section class="content">
        <h2>You ignored your friend's invitation and headed to the library.</h2>
        <h2>You have an assignment due tonight at 11:59 pm!</h2>
    </section>

    <h1 class="header">What will you work on first?</h1>
<p style="text-align: center; font-size: 25px;">
    Select a task, click Start Studying, then Head Home to continue!
</p>
    <div class="btnstyle">
        <button id="researchbtn">Research</button>
        <button id="writingbtn">Writing</button>
    </div>

    <section class="content">
        <h2 id="message">Choose a task to begin!</h2>
        <img id="taskimage" src="images/library.jpg" alt="Study task">
    </section>

    <div class="btnstyle">
        <button id="studybtn">Start Studying!</button>
    </div>

    <div class="btnstyle">
        <button id="homebtn">Head Home!</button>
    </div>

    <script src="js/script.js"></script>

</body>
</html>
