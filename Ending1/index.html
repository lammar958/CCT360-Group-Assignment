<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ending</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- heading and context -->
    <h1>7:45 pm</h1>
    <h1>You start your assignment as soon as possible...</h2>

    <!-- studying image -->
    <section class="studying parallax">
    </section>

    <!-- context -->
    <section class="content">
        <h2>9:35 pm</h2>
    </section>

    <!-- hourglass image -->
    <section class="hourglass parallax"></section>

    <!-- context -->
    <section class="content">
        <h2>11:47 pm</h2>
        <h2>You are almost finished...</h2>
    </section>

    <!-- wifi image -->
    <section class="wifi parallax"></section>

    <!-- context -->
    <section class="content">
        <h2>11:59 pm</h2>
        <h2>Oh No! Your wifi disconnected right as you were submitting your assignment...</h2>
    </section>

    <!-- clock image -->
    <section class="clock parallax"></section>

    <!-- content -->
    <section class="content">
        <h2>12:00 am</h2>
        <h2>You were unable to submit your assignment on time :(</h2>
    </section>

    <div class="btnstyle">
    <button id="restartbtn">Start Again!</button>
</div>
    <!-- connecting javascript -->
    <script src="js/script.js"></script>
</body>

</html>
